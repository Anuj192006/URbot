name: Keep Render Backend Awake

on:
  schedule:
    # Runs every 14 minutes (the maximum frequency before Render's 15-minute inactivity sleep)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          # Retrieve the backend URL from GitHub repository secrets
          URL="${{ secrets.RENDER_BACKEND_URL }}"
          if [ -z "$URL" ]; then
            echo "=========================================================="
            echo "WARNING: RENDER_BACKEND_URL repository secret is not set!"
            echo "Please add it in GitHub -> Settings -> Secrets and variables -> Actions"
            echo "Name: RENDER_BACKEND_URL"
            echo "Value: https://your-backend-name.onrender.com"
            echo "=========================================================="
            exit 1
          fi
          
          # Clean trailing slash if present
          URL=$(echo "$URL" | sed 's/\/$//')
          
          echo "Pinging backend health check at: $URL/api/health"
          response=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 30 "$URL/api/health")
          
          if [ "$response" = "200" ]; then
            echo "Success: Backend is active and responded with 200 OK."
          else
            echo "Notice: Backend responded with status code $response (it may be waking up or initializing)."
          fi
